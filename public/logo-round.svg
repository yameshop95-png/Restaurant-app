<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 70 580 580">
  <title>Logo quán: người phụ nữ đội nón lá đổ bánh cuốn</title>
  <defs>
    <clipPath id="in"><circle cx="360" cy="360" r="252"/></clipPath>
  </defs>
  <circle cx="360" cy="360" r="271" fill="#F3F0E8" stroke="#FF4B00" stroke-width="38"/>
  <g clip-path="url(#in)" stroke-linejoin="round" stroke-linecap="round">
    <!-- hơi nước bốc lên từ nồi -->
    <g fill="#FF4B00">
      <path d="M206 436 C160 392 212 348 194 300 C182 262 196 222 254 196 C222 236 244 266 246 300 C250 352 214 380 226 436 Z"/>
      <path d="M266 404 C226 366 270 326 256 286 C248 258 262 230 314 212 C286 248 304 274 302 304 C300 344 268 362 280 404 Z"/>
    </g>
    <!-- thân áo -->
    <path d="M452 292 C482 282 520 280 548 292 C588 310 606 352 614 420 L624 720 L372 720 C380 640 398 560 418 516 C434 472 440 380 452 292 Z"
      fill="#12110F" stroke="#F3F0E8" stroke-width="8" paint-order="stroke"/>
    <!-- cổ áo -->
    <path d="M478 296 L500 334 L522 296" fill="none" stroke="#F3F0E8" stroke-width="6"/>
    <!-- đầu nhìn nghiêng sang trái, búi tóc sau gáy -->
    <path d="M402 214 C404 226 414 234 410 244 C406 252 416 256 413 263 C411 272 424 276 435 274 C442 286 456 292 474 294 L522 292 C544 286 560 268 552 246 L544 232 Z" fill="#12110F"/>
    <circle cx="552" cy="262" r="17" fill="#12110F"/>
    <!-- cánh tay: vai xuống khuỷu, cẳng tay vươn ra trước -->
    <path d="M510 300 C490 326 472 346 450 352 C420 360 380 352 322 350 L320 382 C372 384 410 392 440 404 C472 416 498 392 512 352 Z"
      fill="#12110F" stroke="#F3F0E8" stroke-width="8" paint-order="stroke"/>
    <ellipse cx="312" cy="368" rx="18" ry="15" fill="#12110F"/>
    <!-- muôi múc bột, bột chảy xuống khăn -->
    <path d="M304 378 L262 420" stroke="#12110F" stroke-width="9"/>
    <path d="M232 420 A18 18 0 0 0 268 420 Z" fill="#12110F"/>
    <path d="M250 440 C250 456 249 472 250 488" fill="none" stroke="#12110F" stroke-width="6"/>
    <!-- nồi hấp bánh cuốn -->
    <path d="M124 498 Q136 660 266 660 Q396 660 408 498 Z" fill="#12110F"/>
    <ellipse cx="266" cy="498" rx="142" ry="25" fill="#F3F0E8" stroke="#12110F" stroke-width="13"/>
    <ellipse cx="266" cy="500" rx="112" ry="14" fill="none" stroke="#12110F" stroke-width="5"/>
    <!-- đĩa bánh cuốn: 3 cuốn xếp chồng -->
    <g transform="translate(436 540) rotate(-24)">
      <rect x="-118" y="44" width="236" height="18" rx="9" fill="#12110F" stroke="#F3F0E8" stroke-width="7" paint-order="stroke"/>
      <g fill="#12110F" stroke="#F3F0E8" stroke-width="7">
        <rect x="-104" y="2" width="200" height="42" rx="21"/>
        <rect x="-60" y="2" width="200" height="42" rx="21"/>
        <rect x="-82" y="-38" width="200" height="42" rx="21"/>
      </g>
      <g fill="#F3F0E8"><circle cx="-83" cy="23" r="15"/><circle cx="-39" cy="23" r="15"/><circle cx="-61" cy="-17" r="15"/></g>
      <g fill="#12110F"><circle cx="-83" cy="23" r="6"/><circle cx="-39" cy="23" r="6"/><circle cx="-61" cy="-17" r="6"/></g>
    </g>
    <!-- nón lá -->
    <path d="M344 206 L470 134 L582 256 Q470 242 344 206 Z" fill="#12110F" stroke="#F3F0E8" stroke-width="8" paint-order="stroke"/>
  </g>
</svg>
